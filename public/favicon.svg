<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
    <linearGradient id="tileGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B9CFF"/>
      <stop offset="0.45" stop-color="#2A5CF6"/>
      <stop offset="1" stop-color="#0A22B4"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#9CC4FF"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#tileGrad)"/>
    <!-- Lane monogram: two nested rounded L strokes -->
    <g fill="none" stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 182 152 L 182 312 Q 182 340 210 340 L 336 340"/>
      <path d="M 244 152 L 244 270 Q 244 292 266 292 L 336 292"/>
    </g>
    <!-- Agent spark -->
    <path d="M 320 160 C 324 182 328 186 350 190 C 328 194 324 198 320 220 C 316 198 312 194 290 190 C 312 186 316 182 320 160 Z" fill="url(#sparkGrad)"/>
  </g>
</svg>
